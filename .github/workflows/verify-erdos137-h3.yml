name: Verify Erdős 137 Lean modules
on:
  push:
    branches: [verify/erdos137-h3]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: formal-conjectures
      - name: Cache pinned Lean and Mathlib
        uses: actions/cache/restore@v4
        id: leaned-cache
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          if [ ! -x "$HOME/.elan/bin/lake" ]; then sh "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain none; fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.leaned-cache.outputs.cache-hit }}" != "true" ]; then
            cd formal-conjectures
            "$HOME/.elan/bin/lake" exe cache get
          fi
      - name: Build the pinned problem module
        shell: bash
        run: |
          cd formal-conjectures
          lake build 'FormalConjectures.ErdosProblems.«137»'
      - name: Save pinned Lean and Mathlib before checking proofs
        if: ${{ steps.leaned-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Compile the odd exponent lemmas
        id: odd
        shell: bash
        run: |
          cd formal-conjectures
          awk '{ print } /^end Erdos137PerfectPower/ { exit }' ../verification/H3_odd_prime.lean > H3OddGraphAudit.lean
          awk '/^private lemma dyadic_rank_intervals_valid/ { exit } { print }' ../verification/H3_odd_bridge.lean | head -n -2 > H3OddBridgeSmoke.lean
          printf '\nend Erdos137OddBridge\n' >> H3OddBridgeSmoke.lean
          set +e
          timeout 1200 lake env lean H3OddGraphAudit.lean > /tmp/erdos137-graph.log 2>&1 &
          graph_check=$!
          timeout 1200 lake env lean ../verification/H3_odd_tail.lean > /tmp/erdos137-tail.log 2>&1 &
          tail_check=$!
          timeout 1200 lake env lean H3OddBridgeSmoke.lean > /tmp/erdos137-bridge.log 2>&1
          bridge_result=$?
          wait "$graph_check"
          graph_result=$?
          wait "$tail_check"
          tail_result=$?
          cat /tmp/erdos137-graph.log /tmp/erdos137-tail.log /tmp/erdos137-bridge.log
          printf 'graph=%s tail=%s bridge=%s\n' "$graph_result" "$tail_result" "$bridge_result"
          test "$graph_result" = 0 && test "$tail_result" = 0 && test "$bridge_result" = 0