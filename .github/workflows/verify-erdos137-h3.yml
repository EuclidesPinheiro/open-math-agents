name: Verify Erdős 137 Lean modules
on:
  push:
    branches: [verify/erdos137-h3]
permissions:
  contents: read
jobs:
  lean:
    name: Lean ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [medium]
    env:
      PART: ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: formal-conjectures
      - name: Cache pinned Lean and Mathlib
        uses: actions/cache/restore@v4
        id: leaned-cache
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          if [ ! -x "$HOME/.elan/bin/lake" ]; then sh "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain none; fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.leaned-cache.outputs.cache-hit }}" != "true" ]; then
            cd formal-conjectures
            "$HOME/.elan/bin/lake" exe cache get
          fi
      - name: Build the pinned problem module
        shell: bash
        run: |
          cd formal-conjectures
          lake build 'FormalConjectures.ErdosProblems.«137»'
      - name: Save pinned Lean and Mathlib before checking proofs
        if: ${{ steps.leaned-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Compile the odd exponent lemmas
        id: odd
        shell: bash
        run: |
          cd formal-conjectures
          case "$PART" in
            bridge)
              cp ../verification/H3_odd_bridge.lean H3LeanAudit.lean
              printf '\n#print axioms Erdos137OddBridge.bridge_rank_product\n#print axioms Erdos137OddBridge.analytic_rank_product\n' >> H3LeanAudit.lean
              ;;
            tail)
              cp ../verification/H3_odd_tail.lean H3LeanAudit.lean
              printf '\n#print axioms Erdos137OddTail.dyadic_prime_bound_valid\n#print axioms Erdos137OddTail.tail_from_prime_estimates\n' >> H3LeanAudit.lean
              ;;
            primorial)
              cp ../verification/H3_odd_primorial.lean H3LeanAudit.lean
              printf '\n#print axioms Erdos137OddPrimorial.primorial_eighth_le\n' >> H3LeanAudit.lean
              ;;
            medium)
              cp ../verification/H3_odd_prime.lean H3LeanAudit.lean
              printf '\n#print axioms Erdos137PerfectPower.medium_odd_prime_of_sylvester\n#print axioms Erdos137PerfectPower.odd_branch_from_rank_certificate\n' >> H3LeanAudit.lean
              ;;
          esac
          timeout -k 5 960 stdbuf -oL -eL lake env lean -Dprofiler=true H3LeanAudit.lean