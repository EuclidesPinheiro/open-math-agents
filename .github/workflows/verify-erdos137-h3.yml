name: Verify Erdős 137 Lean modules
on:
  push:
    branches: [verify/erdos137-h3]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: formal-conjectures
      - name: Cache pinned Lean and Mathlib
        uses: actions/cache/restore@v4
        id: leaned-cache
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          if [ ! -x "$HOME/.elan/bin/lake" ]; then sh "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain none; fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.leaned-cache.outputs.cache-hit }}" != "true" ]; then
            cd formal-conjectures
            "$HOME/.elan/bin/lake" exe cache get
          fi
      - name: Build the pinned problem module
        shell: bash
        run: |
          cd formal-conjectures
          lake build 'FormalConjectures.ErdosProblems.«137»'
      - name: Save pinned Lean and Mathlib before checking proofs
        if: ${{ steps.leaned-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Diagnose the candidate Lean proof
        if: ${{ success() || steps.odd.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export OMA_FC="$PWD/formal-conjectures"
          for reduction in verification/Erdos137*.R1.lean; do cp "$reduction" reductions/; done
          proof=proofs/Erdos137.erdos_137.variants.perfect_power.R1.H3.R1.H2.lean
          cp verification/H3_odd_submission.lean "$proof"
          sed -i -E 's/^set_option maxHeartbeats (0|1500000|1000000) in/set_option maxHeartbeats 350000 in/; s/decide \+kernel/decide/g' "$proof"
          python3 -I tools/lint.py "$proof" data/catalog.json
          mkdir -p formal-conjectures/OMAReductions
          for reduction in verification/Erdos137*.R1.lean; do
            module=$(basename "$reduction" .lean | sed 's/[^A-Za-z0-9]/_/g')
            cp "$reduction" "formal-conjectures/OMAReductions/R_${module}.lean"
          done
          cd formal-conjectures
          grep -q 'name = "OMAReductions"' lakefile.toml || printf '\n[[lean_lib]]\nname = "OMAReductions"\nglobs = ["OMAReductions.+"]\n' >> lakefile.toml
          lake build OMAReductions.R_Erdos137_erdos_137_variants_perfect_power_R1_H3_R1
          rc=0
          timeout -k 5 180 lake env lean ../"$proof" > /tmp/erdos137-bounded.log 2>&1 || rc=$?
          cat /tmp/erdos137-bounded.log
          exit "$rc"