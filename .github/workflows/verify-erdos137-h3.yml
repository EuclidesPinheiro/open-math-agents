name: Verify Erdős 137 Lean modules
on:
  push:
    branches: [verify/erdos137-h3]
permissions:
  contents: read
jobs:
  lean:
    name: Lean ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [primorial, medium]
    env:
      PART: ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: formal-conjectures
      - name: Cache pinned Lean and Mathlib
        uses: actions/cache/restore@v4
        id: leaned-cache
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          if [ ! -x "$HOME/.elan/bin/lake" ]; then sh "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain none; fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.leaned-cache.outputs.cache-hit }}" != "true" ]; then
            cd formal-conjectures
            "$HOME/.elan/bin/lake" exe cache get
          fi
      - name: Build the pinned problem module
        shell: bash
        run: |
          cd formal-conjectures
          lake build 'FormalConjectures.ErdosProblems.«137»'
      - name: Save pinned Lean and Mathlib before checking proofs
        if: ${{ steps.leaned-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Compile the odd exponent lemmas
        id: odd
        shell: bash
        run: |
          cd formal-conjectures
          python3 - <<'PY'
          from pathlib import Path
          import os
          v = Path('../verification')
          bridge = (v/'H3_odd_bridge.lean').read_text(encoding='utf-8').split('lemma prime_prefix_add', 1)[0]
          part = os.environ['PART']
          name = 'H3_odd_prime.lean' if part == 'medium' else 'H3_odd_primorial.lean'
          component = (v/name).read_text(encoding='utf-8')
          lines = (bridge + component).splitlines()
          imports = list(dict.fromkeys(l for l in lines if l.startswith('import ') and l != 'import H3OddBridge'))
          body = lambda content: '\n'.join(l for l in content.splitlines() if not l.startswith('import '))
          check = 'Erdos137PerfectPower.medium_odd_prime_of_sylvester' if part == 'medium' else 'Erdos137OddPrimorial.primorial_eighth_le'
          Path('H3LeanAudit.lean').write_text('\n'.join(imports) + '\n\n' + body(bridge)
              + '\nend Erdos137OddBridge\n' + body(component) + '\n#print axioms ' + check + '\n', encoding='utf-8')
          PY
          timeout -k 5 600 stdbuf -oL -eL lake env lean -Dprofiler=true H3LeanAudit.lean