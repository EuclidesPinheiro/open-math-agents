name: Verify Erdős 137 Lean modules
on:
  push:
    branches: [verify/erdos137-h3]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: formal-conjectures
      - name: Cache pinned Lean and Mathlib
        uses: actions/cache/restore@v4
        id: leaned-cache
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          if [ ! -x "$HOME/.elan/bin/lake" ]; then sh "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain none; fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.leaned-cache.outputs.cache-hit }}" != "true" ]; then
            cd formal-conjectures
            "$HOME/.elan/bin/lake" exe cache get
          fi
      - name: Build the pinned problem module
        shell: bash
        run: |
          cd formal-conjectures
          lake build 'FormalConjectures.ErdosProblems.«137»'
      - name: Save pinned Lean and Mathlib before checking proofs
        if: ${{ steps.leaned-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: erdos137-fc-9097e2f90e66
          path: |
            ~/.elan
            formal-conjectures/.lake
      - name: Compile the odd exponent lemmas
        id: odd
        shell: bash
        run: |
          cd formal-conjectures
          awk '/private def smallPrimeList/ { exit } { print }' ../verification/H3_odd_prime.lean > H3OddGeneric.lean
          printf '\nend Erdos137PerfectPower\n' >> H3OddGeneric.lean
          timeout 120 lake env lean H3OddGeneric.lean
          cp ../verification/H3_odd_prime.lean H3OddAudit.lean
          printf '\n#print axioms Erdos137PerfectPower.distinct_pair_products_mod_l\n#print axioms Erdos137PerfectPower.distinct_multiset_products_mod_l\n#print axioms Erdos137PerfectPower.restricted_prod_dvd_factorial\n#print axioms Erdos137PerfectPower.three_odd_exponent_of_sylvester\n#print axioms Erdos137PerfectPower.factor_cover_card_of_distinct_products\n#print axioms Erdos137PerfectPower.small_odd_prime_of_sylvester\n' >> H3OddAudit.lean
          timeout 720 lake env lean H3OddAudit.lean